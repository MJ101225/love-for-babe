<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>For My Babe ❤️</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#ff758c,#ff7eb3);font-family:sans-serif;overflow:hidden}
.card{background:white;padding:30px 25px;border-radius:25px;text-align:center;box-shadow:0 15px 35px rgba(0,0,0,0.2);max-width:320px}
h1{color:#ff2a6d;font-size:28px}
.heart{font-size:60px;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
button{padding:12px 25px;background:#ff2a6d;color:white;border:none;border-radius:25px;font-weight:bold;margin-top:10px}
.hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
.hearts span{position:absolute;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-100px)}100%{transform:translateY(100vh)}}
</style></head>
<body>
<div class="hearts" id="hearts"></div>
<div class="card">
<div class="heart">💖</div>
<h1>I LOVE YOU MOST BABE</h1>
<p>Hi love, ginawa ko to para sayo lang. Ikaw lang mahalaga sakin.</p>
<p style="color:#ff2a6d;font-weight:bold">- Mark Jay</p>
<button onclick="document.getElementById('msg').style.display='block'">Click me Babe 💋</button>
<p id="msg" style="display:none;margin-top:15px;color:#ff2a6d;font-weight:bold;font-size:18px">I LOVE YOU MORE THAN ANYTHING! Ikaw lang forever ko! 💍❤️</p>
</div>
<script>
let hearts=document.getElementById('hearts');
setInterval(()=>{let s=document.createElement('span');s.innerText='💖';s.style.left=Math.random()*100+'vw';s.style.animationDuration=(Math.random()*3+2)+'s';s.style.fontSize=(Math.random()*20+15)+'px';hearts.appendChild(s);setTimeout(()=>s.remove(),5000)},200);
</script>
</body></html>
